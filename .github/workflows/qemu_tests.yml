name: QEMU tests
# Opt-in: label `qemu-tests` na PR = job functional, label `qemu-bugs` = job bugs (informacyjny); jeden bieg na label; ponowny bieg: zdjac i dodac label albo workflow_dispatch.
on:
  pull_request:
    types: [labeled]
    branches:
      - master
  workflow_dispatch:
    inputs:
      suite:
        description: "Zestaw testow"
        type: choice
        options:
          - functional
          - bugs
          - all
        default: functional

permissions:
  contents: read

# Cala logika jest w tools/qemu_test/qemu_test.sh (build, image, run, report, cleanup) - tu tylko wywolania podkomend.
jobs:
  qemu-functional:
    name: QEMU functional
    # Host runner (nie kontener): QEMU w Dockerze wymaga demona Dockera i /dev/net/tun;
    # bazel z bazel-contrib/setup-bazel (wersja z .bazelversion) jest prostszy niz Docker-in-Docker.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite != 'bugs') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'qemu-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # Per job: a skipped job never joins the group, so an unrelated label cannot cancel a running suite.
    concurrency:
      group: qemu-tests-functional-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: qemu-tests
          repository-cache: true

      - name: Build EC sim package and QEMU image
        timeout-minutes: 20
        run: tools/qemu_test/qemu_test.sh build

      - name: Build test container image
        timeout-minutes: 10
        run: tools/qemu_test/qemu_test.sh image

      - name: Run functional tests
        timeout-minutes: 30
        run: tools/qemu_test/qemu_test.sh run functional --no-build

      - name: Summary
        if: always()
        run: tools/qemu_test/qemu_test.sh report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-functional-results
          path: qemu_test_results/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: tools/qemu_test/qemu_test.sh cleanup

  qemu-bugs:
    name: QEMU bugs (informational)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'bugs' || inputs.suite == 'all')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'qemu-bugs')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 80
    concurrency:
      group: qemu-tests-bugs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: qemu-tests
          repository-cache: true

      - name: Build EC sim package and QEMU image
        timeout-minutes: 20
        run: tools/qemu_test/qemu_test.sh build

      - name: Build test container image
        timeout-minutes: 10
        run: tools/qemu_test/qemu_test.sh image

      - name: Run bugs tests (red expected)
        timeout-minutes: 40
        run: tools/qemu_test/qemu_test.sh run bugs --no-build

      - name: Summary (F-xx table)
        if: always()
        run: tools/qemu_test/qemu_test.sh report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-bugs-results
          path: qemu_test_results/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: tools/qemu_test/qemu_test.sh cleanup
