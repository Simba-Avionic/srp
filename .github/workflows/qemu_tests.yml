---
name: QEMU tests
# Opt-in: dodanie labela `qemu-tests` do PR = jeden bieg; ponowny bieg: zdjac i dodac label albo workflow_dispatch.
on:
  pull_request:
    types: [labeled]
    branches:
      - master
  workflow_dispatch:
    inputs:
      suite:
        description: "Zestaw testow"
        type: choice
        options:
          - functional
          - bugs
          - all
        default: functional

permissions:
  contents: read

jobs:
  qemu-functional:
    name: QEMU functional
    # Host runner (nie kontener): QEMU w Dockerze wymaga demona Dockera i /dev/net/tun;
    # bazel z bazel-contrib/setup-bazel (wersja z .bazelversion) jest prostszy niz Docker-in-Docker.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite != 'bugs') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'qemu-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Per job: a skipped job never joins the group, so an unrelated label cannot cancel a running suite.
    concurrency:
      group: qemu-tests-functional-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: qemu-tests
          repository-cache: true

      - name: Run functional QEMU tests
        run: tools/qemu_test/qemu_test.sh functional

      - name: Job summary
        if: always()
        run: |
          {
            echo "## QEMU functional"
            if [ -f qemu_test_results/functional.q.txt ]; then
              echo '```'; tail -n 40 qemu_test_results/functional.q.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-functional-results
          path: qemu_test_results/
          retention-days: 7
          if-no-files-found: warn

  qemu-bugs:
    name: QEMU bugs (informational)
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'bugs' || inputs.suite == 'all')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    concurrency:
      group: qemu-tests-bugs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: qemu-tests
          repository-cache: true

      - name: Run bugs QEMU tests (red expected)
        run: tools/qemu_test/qemu_test.sh bugs

      - name: Job summary (F-xx table)
        if: always()
        run: |
          {
            echo "## QEMU bugs (informational, red = bug reproduced)"
            # mapping.md is produced by qemu_test.sh (tools/qemu_test/make_mapping.py <repo>)
            if [ -f qemu_test_results/mapping.md ]; then cat qemu_test_results/mapping.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-bugs-results
          path: qemu_test_results/
          retention-days: 7
          if-no-files-found: warn
